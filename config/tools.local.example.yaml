# 本机工具配置模板。复制为 tools.local.yaml 后按实际路径修改。
# 该文件和实际 tools.local.yaml 都不会进入上传包。
schema_version: 2
root: <HARUKA_SVS_TOOLS_ROOT>
cache_dir: <HARUKA_SVS_TOOLS_ROOT>/cache
temp_dir: <HARUKA_SVS_TOOLS_ROOT>/tmp
mfa:
  executable: <HARUKA_SVS_TOOLS_ROOT>/miniforge3/envs/mfa/Scripts/mfa.exe
  conda_prefix: <HARUKA_SVS_TOOLS_ROOT>/miniforge3
  environment: mfa
  root_dir: <HARUKA_SVS_TOOLS_ROOT>/mfa
  temp_dir: <HARUKA_SVS_TOOLS_ROOT>/mfa/tmp
  # MFA 官方模型库在 MFA_ROOT_DIR/pretrained_models 下按类型分目录保存。
  acoustic_model: <HARUKA_SVS_TOOLS_ROOT>/mfa/pretrained_models/acoustic/japanese_mfa.zip
  dictionary: <HARUKA_SVS_TOOLS_ROOT>/mfa/pretrained_models/dictionary/japanese_mfa.dict
  g2p_model: <HARUKA_SVS_TOOLS_ROOT>/mfa/pretrained_models/g2p/japanese_mfa.zip
game:
  python: <HARUKA_SVS_TOOLS_ROOT>/GAME/.venv/Scripts/python.exe
  root: <HARUKA_SVS_TOOLS_ROOT>/GAME
g2p:
  python: <GPT_SOVITS_ROOT>/runtime/python.exe
  cwd: <GPT_SOVITS_ROOT>
diffsinger:
  root: <HARUKA_SVS_TOOLS_ROOT>/DiffSinger

vocal2midi:
  # 只有任务 job.yaml 显式设置 enabled: true 才会启动自动前端。
  enabled: false
  root: D:/Vocal2Midi-Local
  python: D:/Vocal2Midi-Local/.venv/Scripts/python.exe
  device: dml
  language: ja
  lyric_output_mode: kana
  slice_min_sec: 5.0
  slice_max_sec: 10.0
  tempo: 120.0
  output_pitch_curve: true
