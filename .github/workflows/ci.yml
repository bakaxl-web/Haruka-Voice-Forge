name: Haruka Voice Forge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cover preparation dependencies
        run: python -m pip install -r requirements-coverprep.txt

      - name: Run all tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check repository file policy
        run: python tools/check_repo_policy.py .

      - name: Validate model manifest schema
        run: python tools/model_registry.py validate --directory manifests/models
