schema_version: 2
job_id: example
mode: guide
language: ja
source: ./inputs/source.wav
guide_vocal: ./inputs/guide.wav
score: ./inputs/score.ds
lyrics: ./inputs/lyrics.tsv
model_profile: ./profiles/model_profile.yaml
language_profile: ./profiles/languages/ja_common.yaml
tool_config: ./config/tools.local.yaml
lexicon_overrides: ./inputs/song.dict
separator:
  adapter: configured-only
  command: ''
aligner:
  adapter: mfa
  command: ''
g2p:
  adapter: configured-only
  command: ''
game:
  adapter: GAME
  command: ''
  model: ''
pitch:
  adapter: parselmouth
  timestep: 0.01
vocal2midi:
  # 仅在 guide 模式且 score/lyrics 都为空时生效；需显式改为 true。
  enabled: false
  root: D:/Vocal2Midi-Local
  python: D:/Vocal2Midi-Local/.venv/Scripts/python.exe
  device: dml
  language: ja
  lyric_output_mode: kana
  slice_min_sec: 5.0
  slice_max_sec: 10.0
  tempo: 120.0
  output_pitch_curve: true
include_stems: false
